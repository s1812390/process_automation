stages:
  - build
  - deploy

default:
  tags:
    - bss-prod

variables:
  BACKEND_IMAGE: harbor-digital.tele2.kz/bss/process-automation-backend
  FRONTEND_IMAGE: harbor-digital.tele2.kz/bss/process-automation-frontend
  REDIS_IMAGE: harbor-digital.tele2.kz/bss/process-automation-redis
  COMPOSE_PATH: /data/docker-compose/financial_dep/$CI_PROJECT_NAME

mirror-redis:
  stage: build
  before_script:
    - docker login -u $HARBOR_USERNAME -p $HARBOR_PASSWORD $HARBOR_HOST
  script:
    - docker pull redis:7-alpine
    - docker tag redis:7-alpine $REDIS_IMAGE:7-alpine
    - docker push $REDIS_IMAGE:7-alpine

build-backend:
  stage: build
  before_script:
    - docker login -u $HARBOR_USERNAME -p $HARBOR_PASSWORD $HARBOR_HOST
  script:
    - >
      docker build --cache-from $BACKEND_IMAGE:$CI_COMMIT_REF_SLUG
      -t $BACKEND_IMAGE:$CI_COMMIT_REF_SLUG
      -f ./backend/Dockerfile ./backend
    - docker push $BACKEND_IMAGE:$CI_COMMIT_REF_SLUG

build-frontend:
  stage: build
  variables:
    HARBOR_IMAGE: "${HARBOR_HOST}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}"
  before_script:
    - docker login -u $HARBOR_USERNAME -p $HARBOR_PASSWORD $HARBOR_HOST
  script:
    - >
      docker build --cache-from $FRONTEND_IMAGE:$CI_COMMIT_REF_SLUG
      -t $FRONTEND_IMAGE:$CI_COMMIT_REF_SLUG
      --build-arg VITE_COMMIT_COUNT="$CI_PIPELINE_IID"
      --build-arg VITE_COMMIT_MESSAGE="$CI_COMMIT_TITLE"
      -f ./frontend/Dockerfile .
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_REF_SLUG

Deploy:
  stage: deploy
  image: inh-registry.tele2.kz/inhouse-devops/toolbox:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  before_script:
    - apt-get update -y && apt-get install openssh-client git gettext -y
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SSH_SERVER_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh -T finuser@$SSH_SERVER_HOST
    - ssh finuser@$SSH_SERVER_HOST mkdir -p $COMPOSE_PATH
    - envsubst < docker-compose.prod.yml > /tmp/docker-compose.rendered.yml
    - scp /tmp/docker-compose.rendered.yml finuser@$SSH_SERVER_HOST:$COMPOSE_PATH/docker-compose.yml
    - |
      ssh finuser@$SSH_SERVER_HOST "
        cd $COMPOSE_PATH &&
        docker-compose pull &&
        docker-compose stop &&
        docker-compose rm -f &&
        docker volume rm ${CI_PROJECT_NAME}_celery_beat_schedule 2>/dev/null || true &&
        docker network rm ${CI_PROJECT_NAME}_default 2>/dev/null || true &&
        docker-compose up -d --remove-orphans
      "
